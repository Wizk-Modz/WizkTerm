name: Build And Attach Release APKs

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag của release cần build APK (ví dụ v0.119.0). Bỏ trống nếu chạy do publish release.'
        required: false
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant: [ apt-android-7 ]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash {0}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
              RELEASE_TAG="${{ inputs.tag }}"
          else
              RELEASE_TAG="${GITHUB_REF/refs\/tags\//}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "Resolved release tag: $RELEASE_TAG"

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode release keystore
        shell: bash {0}
        env:
          KEYSTORE_BASE64: ${{ secrets.WIZK_KEYSTORE_BASE64 }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          if [ -z "$KEYSTORE_BASE64" ]; then
              exit_on_error "Secret WIZK_KEYSTORE_BASE64 is not set. Cannot sign release APK."
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/wizk.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"; then
              exit_on_error "Failed to decode keystore from WIZK_KEYSTORE_BASE64 secret."
          fi

          echo "WIZK_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore decoded to $KEYSTORE_PATH"

      - name: Build signed release APK
        shell: bash {0}
        env:
          PACKAGE_VARIANT: ${{ matrix.package_variant }}
          WIZK_KEYSTORE_PASSWORD: ${{ secrets.WIZK_KEYSTORE_PASSWORD }}
          WIZK_KEY_ALIAS: ${{ secrets.WIZK_KEY_ALIAS }}
          WIZK_KEY_PASSWORD: ${{ secrets.WIZK_KEY_PASSWORD }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          echo "Setting vars"
          RELEASE_VERSION_NAME="$RELEASE_TAG"

          # versionName must follow semver 2.0.0
          if ! printf "%s" "${RELEASE_VERSION_NAME/v/}" | grep -qP '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'; then
           exit_on_error "The versionName '${RELEASE_VERSION_NAME/v/}' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html."
          fi

          APK_DIR_PATH="./app/build/outputs/apk/release"
          APK_VERSION_TAG="$RELEASE_VERSION_NAME-${{ env.PACKAGE_VARIANT }}-github-release"
          APK_BASENAME_PREFIX="wizkterm-app_$APK_VERSION_TAG"
          APK_RELEASE_NAME="WizkTerm-${RELEASE_VERSION_NAME/v/}-arm64-v8a.apk"

          echo "APK_DIR_PATH=$APK_DIR_PATH" >> $GITHUB_ENV
          echo "APK_VERSION_TAG=$APK_VERSION_TAG" >> $GITHUB_ENV
          echo "APK_BASENAME_PREFIX=$APK_BASENAME_PREFIX" >> $GITHUB_ENV
          echo "APK_RELEASE_NAME=$APK_RELEASE_NAME" >> $GITHUB_ENV

          echo "Building signed release APK for '$APK_VERSION_TAG'"
          export TERMUX_APP_VERSION_NAME="${RELEASE_VERSION_NAME/v/}" # Used by app/build.gradle
          export TERMUX_APK_VERSION_TAG="$APK_VERSION_TAG" # Used by app/build.gradle
          export TERMUX_PACKAGE_VARIANT="${{ env.PACKAGE_VARIANT }}" # Used by app/build.gradle
          export TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS="1" # Chỉ build và split cho arm64-v8a
          if ! ./gradlew assembleRelease; then
            exit_on_error "Build failed for '$APK_VERSION_TAG'."
          fi

          echo "Validating APK"
          if ! test -f "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk"; then
            files_found="$(ls "$APK_DIR_PATH")"
            exit_on_error "Failed to find built APK at '$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk'. Files found: "$'\n'"$files_found"
          fi

          echo "Renaming APK to '$APK_RELEASE_NAME'"
          cp "$APK_DIR_PATH/${APK_BASENAME_PREFIX}_arm64-v8a.apk" "$APK_DIR_PATH/$APK_RELEASE_NAME"

          echo "Generating sha256sums file"
          if ! (cd "$APK_DIR_PATH"; sha256sum "$APK_RELEASE_NAME" > "$APK_RELEASE_NAME.sha256"); then
            exit_on_error "Generate sha256sums failed for '$APK_RELEASE_NAME'."
          fi

      - name: Attach APK to GitHub release
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exit_on_error() { echo "$1"; exit 1; }

          APK_PATH="$APK_DIR_PATH/$APK_RELEASE_NAME"
          SHA_PATH="$APK_PATH.sha256"

          echo "Attaching '$APK_RELEASE_NAME' to release '$RELEASE_TAG'"
          if ! gh release upload "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" --clobber; then
            exit_on_error "Attach APK to release failed for '$RELEASE_TAG'."
          fi

          echo "Attached files:"
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name'

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_RELEASE_NAME }}
          path: |
            ${{ env.APK_DIR_PATH }}/${{ env.APK_RELEASE_NAME }}
            ${{ env.APK_DIR_PATH }}/${{ env.APK_RELEASE_NAME }}.sha256
